<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1064 140" width="1064" height="140">
<!-- The OMX-27 keys with AUX held. Render with: inkscape omx-shift.svg --export-type=png --export-filename=images/omx-shift.png --export-width=2128 -->
<style>
